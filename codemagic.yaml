# Descent Tutor — Unity 2022.3.10f1 iOS CI/CD
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-unity-app/
#
# Codemagic UI setup (once):
# 1. Team → Global variables / groups → create group "unity_credentials" with secrets:
#    UNITY_EMAIL (not UNITY_USERNAME), UNITY_SERIAL, UNITY_PASSWORD
# 2. App Store Connect API (pick ONE approach):
#    A) Team settings → Integrations → Developer Portal → add key; set integrations.app_store_connect below to that exact name.
#    B) Team or app → Environment variables → group "appstore_credentials" (secrets):
#       APP_STORE_CONNECT_PRIVATE_KEY (.p8 contents)
#       APP_STORE_CONNECT_KEY_IDENTIFIER (Key ID)
#       APP_STORE_CONNECT_ISSUER_ID (Issuer ID)
#       CERTIFICATE_PRIVATE_KEY (optional; RSA key if CI must create a new distribution cert)
# 3. Apple Developer App ID: com.zflite.descenttutor (Team ID 2UAB2MQ7J5)
# 4. Replace APP_STORE_APPLE_ID below
# 5. Unity Personal licenses cannot activate on CI — Plus or Pro required

workflows:
  descent-tutor-ios:
    name: Descent Tutor iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Option A: uncomment and set to your Developer Portal integration key name in Codemagic UI:
    # integrations:
    #   app_store_connect: YOUR_ASC_KEY_NAME

    environment:
      unity: 2022.3.10f1
      xcode: latest
      groups:
        - unity_credentials
        - appstore_credentials
      vars:
        BUNDLE_ID: com.zflite.descenttutor
        APPLE_TEAM_ID: 2UAB2MQ7J5 # App ID Prefix / Apple Developer Team ID
        UNITY_IOS_DIR: Build/iOS
        XCODE_PROJECT: Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        # Numeric Apple ID from App Store Connect → App Information
        APP_STORE_APPLE_ID: 0

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true

    scripts:
      - name: Activate Unity license
        script: |
          set -e
          if [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "Missing unity_credentials: set UNITY_EMAIL, UNITY_SERIAL, UNITY_PASSWORD (not UNITY_USERNAME)."
            exit 1
          fi
          case "$UNITY_SERIAL" in
            *UnityPers*|*Personal*)
              echo "UNITY_SERIAL looks like Personal; Codemagic needs Unity Pro serial from Hub → Manage licenses."
              exit 1
              ;;
          esac
          activate_unity() {
            "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile - \
              -serial "${UNITY_SERIAL}" \
              -username "${UNITY_EMAIL}" \
              -password "${UNITY_PASSWORD}"
          }
          for attempt in 1 2 3 4 5; do
            echo "Unity license activation attempt ${attempt}/5..."
            if activate_unity; then
              echo "Unity license activated."
              exit 0
            fi
            echo "Activation failed; waiting 30s before retry (Unity login rate limits)..."
            sleep 30
          done
          echo "Unity license activation failed after 5 attempts."
          exit 1

      - name: Set up keychain for code signing
        script: |
          set -e
          keychain initialize

      - name: Fetch App Store signing files from Apple
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Fetch iOS distribution certificate
        script: |
          set -e
          app-store-connect certificates list --type IOS_DISTRIBUTION --save || \
          app-store-connect certificates create --type IOS_DISTRIBUTION --save

      - name: Add signing certificates to keychain
        script: |
          set -e
          keychain add-certificates

      - name: Export Xcode project from Unity
        script: |
          set -e
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile - \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod CiBuild.BuildiOS \
            -nographics

      - name: Set up code signing on Xcode project
        script: |
          set -e
          xcode-project use-profiles

      - name: Set iOS build number from App Store Connect
        script: |
          set -e
          if [ "$APP_STORE_APPLE_ID" = "0" ]; then
            echo "APP_STORE_APPLE_ID is not set; skipping agvtool bump."
            exit 0
          fi
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          cd "$CM_BUILD_DIR/$UNITY_IOS_DIR"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Install CocoaPods (Firebase / EDM)
        script: |
          set -e
          if [ -f "$CM_BUILD_DIR/$UNITY_IOS_DIR/Podfile" ]; then
            cd "$CM_BUILD_DIR/$UNITY_IOS_DIR"
            pod install
          fi

      - name: Build IPA
        script: |
          set -e
          IOS_DIR="$CM_BUILD_DIR/$UNITY_IOS_DIR"
          if [ -d "$IOS_DIR/Unity-iPhone.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "$IOS_DIR/Unity-iPhone.xcworkspace" \
              --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa \
              --project "$IOS_DIR/$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - Build/iOS/**/*.dSYM
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      scripts:
        - name: Deactivate Unity license
          script: |
            set -e
            "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile - \
              -returnlicense \
              -username "${UNITY_EMAIL}" \
              -password "${UNITY_PASSWORD}"
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  descent-tutor-android:
    name: Descent Tutor Android (UI Test scene)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      unity: 2022.3.10f1
      android_signing:
        - descent_tutor_keystore
      groups:
        - unity_credentials
        - google_play
      vars:
        PACKAGE_NAME: com.zflite.descenttutor
        GOOGLE_PLAY_TRACK: internal
        UNITY_ANDROID_DIR: Build/Android

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true

    scripts:
      - name: Activate Unity license
        script: |
          set -e
          if [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "Missing unity_credentials: set UNITY_EMAIL, UNITY_SERIAL, UNITY_PASSWORD (not UNITY_USERNAME)."
            exit 1
          fi
          case "$UNITY_SERIAL" in
            *UnityPers*|*Personal*)
              echo "UNITY_SERIAL looks like Personal; Codemagic needs Unity Pro serial from Hub → Manage licenses."
              exit 1
              ;;
          esac
          activate_unity() {
            "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile - \
              -serial "${UNITY_SERIAL}" \
              -username "${UNITY_EMAIL}" \
              -password "${UNITY_PASSWORD}"
          }
          for attempt in 1 2 3 4 5; do
            echo "Unity license activation attempt ${attempt}/5..."
            if activate_unity; then
              echo "Unity license activated."
              exit 0
            fi
            echo "Activation failed; waiting 30s before retry (Unity login rate limits)..."
            sleep 30
          done
          echo "Unity license activation failed after 5 attempts."
          exit 1

      - name: Set Android bundle version code from Google Play
        script: |
          set -e
          BUILD_NUMBER=$(($(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --tracks="$GOOGLE_PLAY_TRACK") + 1))
          echo "ANDROID_BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Export Android App Bundle from Unity
        script: |
          set -e
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile - \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod CiBuild.BuildAndroid \
            -nographics

      - name: Copy AAB for artifacts
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/build/android"
          cp "$CM_BUILD_DIR/$UNITY_ANDROID_DIR/"*.aab "$CM_BUILD_DIR/build/android/" 2>/dev/null || \
          cp "$CM_BUILD_DIR/$UNITY_ANDROID_DIR/DescentTutor.aab" "$CM_BUILD_DIR/build/android/"

    artifacts:
      - build/android/*.aab
      - Build/Android/*.aab

    publishing:
      scripts:
        - name: Deactivate Unity license
          script: |
            set -e
            "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile - \
              -returnlicense \
              -username "${UNITY_EMAIL}" \
              -password "${UNITY_PASSWORD}"
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: true
