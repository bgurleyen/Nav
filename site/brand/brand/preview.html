<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zflite logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c0c24;
    }
    .lockup {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    img {
      width: 112px;
      height: 112px;
    }
    span {
      color: #f4edc3;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 92px;
      line-height: 1;
      letter-spacing: -0.03em;
    }
  </style>
</head>
<body>
  <div class="lockup">
    <img src="mark.svg" alt="">
    <span>Zflite</span>
  </div>
</body>
</html>
